plugins { id 'com.android.application' }

// Only the public client identifier is distributed with the Android application.
def envFile = rootProject.file('../.env')
def idLine = envFile.exists() ? envFile.readLines('UTF-8').find { it ==~ /\s*ISTHEREANYDEAL_CLIENT_ID\s*=.*/ } : null
def publicId = providers.environmentVariable('ISTHEREANYDEAL_CLIENT_ID').getOrElse(
    idLine == null ? '' : idLine.substring(idLine.indexOf('=') + 1).trim().replaceAll(/^['"]|['"]$/, ''))
if (!(publicId ==~ /[A-Za-z0-9._~-]*/)) throw new GradleException('Invalid public IsThereAnyDeal client ID')

android {
    namespace 'in.rupeeraid.mobile'
    compileSdk 37
    defaultConfig {
        applicationId 'in.rupeeraid.mobile'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '1.8.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'ITAD_CLIENT_ID', '"' + publicId + '"'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
